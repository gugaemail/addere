services:
  # ── PRODUCTION ──────────────────────────────────────────────────────────────
  - type: web
    name: addere-api
    runtime: node
    region: oregon
    plan: starter
    # rootDir não definido — build roda da raiz do monorepo (necessário para npm workspaces)
    buildCommand: npm install --include=dev && npx prisma generate --schema=packages/db/prisma/schema.prisma && DATABASE_URL=${DATABASE_URL_DIRECT:-$DATABASE_URL} npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma && npm run build --workspace=@addere/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      # Sem isto o Render instala o Node padrao do dia do build - o runtime de
      # producao podia mudar sozinho. Mantenha igual ao node-version do ci.yml.
      - key: NODE_VERSION
        value: '26'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Preencher manualmente no painel Render (nunca commitar segredos)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PROTHEUS_ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CORS_ORIGIN
        value: https://addere.vercel.app
      # Agendador do faturamento (plano 016). Ligar só de propósito: no staging,
      # para teste; em produção, depois do primeiro contrato aceito. Ao ligar no
      # painel, troque aqui também — senão uma sincronização do Blueprint volta
      # o valor para 'false'.
      - key: BILLING_JOBS_ENABLED
        value: 'false'
      # Proxies na frente da API (plano 014): confira no staging que o IP do
      # cliente aparece nos logs (remoteAddress); se aparecer o do proxy, use 2
      - key: TRUST_PROXY_HOPS
        value: '1'
      # Links e envio dos e-mails (reset de senha e contrato para aceite).
      # WEB_URL é o painel deste ambiente; sem ela o link cai no fallback
      - key: WEB_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # ── STAGING ─────────────────────────────────────────────────────────────────
  - type: web
    name: addere-api-staging
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install --include=dev && npx prisma generate --schema=packages/db/prisma/schema.prisma && DATABASE_URL=${DATABASE_URL_DIRECT:-$DATABASE_URL} npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma && npm run build --workspace=@addere/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      # Sem isto o Render instala o Node padrao do dia do build - o runtime de
      # producao podia mudar sozinho. Mantenha igual ao node-version do ci.yml.
      - key: NODE_VERSION
        value: '26'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Preencher manualmente no painel Render (nunca commitar segredos)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PROTHEUS_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://addere-staging.vercel.app
      # Agendador do faturamento (plano 016). Ligar só de propósito: no staging,
      # para teste; em produção, depois do primeiro contrato aceito. Ao ligar no
      # painel, troque aqui também — senão uma sincronização do Blueprint volta
      # o valor para 'false'.
      - key: BILLING_JOBS_ENABLED
        value: 'false'
      # Proxies na frente da API (plano 014): confira no staging que o IP do
      # cliente aparece nos logs (remoteAddress); se aparecer o do proxy, use 2
      - key: TRUST_PROXY_HOPS
        value: '1'
      # Links e envio dos e-mails (reset de senha e contrato para aceite).
      # WEB_URL é o painel deste ambiente; sem ela o link cai no fallback
      - key: WEB_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
