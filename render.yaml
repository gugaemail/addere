services:
  # ── PRODUCTION ──────────────────────────────────────────────────────────────
  - type: web
    name: addere-api
    runtime: node
    region: oregon
    plan: starter
    # rootDir não definido — build roda da raiz do monorepo (necessário para npm workspaces)
    buildCommand: npm install --include=dev && npx prisma generate --schema=packages/db/prisma/schema.prisma && DATABASE_URL=${DATABASE_URL_DIRECT:-$DATABASE_URL} npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma && npm run build --workspace=@addere/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      # Sem isto o Render instala o Node padrao do dia do build - o runtime de
      # producao podia mudar sozinho. Mantenha igual ao node-version do ci.yml.
      - key: NODE_VERSION
        value: '26'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Preencher manualmente no painel Render (nunca commitar segredos)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PROTHEUS_ENCRYPTION_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CORS_ORIGIN
        value: https://addere.vercel.app
      # Agendador do faturamento (plano 016). Ligar só de propósito: no staging,
      # para teste; em produção, depois do primeiro contrato aceito. Ao ligar no
      # painel, troque aqui também — senão uma sincronização do Blueprint volta
      # o valor para 'false'.
      - key: BILLING_JOBS_ENABLED
        value: 'false'
      # Proxies na frente da API (plano 014): a Cloudflare e o balanceador do
      # Render, 2. Com 1, o remoteAddress dos logs era um IP da Cloudflare
      # (172.71.x, 104.23.x) em 17/10/2026. Mudou a infraestrutura? Confira
      # de novo nos logs que o remoteAddress é o IP de quem chamou
      - key: TRUST_PROXY_HOPS
        value: '2'
      # Links e envio dos e-mails (reset de senha e contrato para aceite).
      # WEB_URL é o painel deste ambiente; sem ela o link cai no fallback
      - key: WEB_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # ── STAGING ─────────────────────────────────────────────────────────────────
  - type: web
    name: addere-api-staging
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install --include=dev && npx prisma generate --schema=packages/db/prisma/schema.prisma && DATABASE_URL=${DATABASE_URL_DIRECT:-$DATABASE_URL} npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma && npm run build --workspace=@addere/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      # Sem isto o Render instala o Node padrao do dia do build - o runtime de
      # producao podia mudar sozinho. Mantenha igual ao node-version do ci.yml.
      - key: NODE_VERSION
        value: '26'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Preencher manualmente no painel Render (nunca commitar segredos)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PROTHEUS_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://addere-staging.vercel.app
      # Agendador do faturamento (plano 016). Ligar só de propósito: no staging,
      # para teste; em produção, depois do primeiro contrato aceito. Ao ligar no
      # painel, troque aqui também — senão uma sincronização do Blueprint volta
      # o valor para 'false'.
      - key: BILLING_JOBS_ENABLED
        value: 'false'
      # Proxies na frente da API (plano 014): no staging são 3. Além da
      # Cloudflare e do balanceador, o serviço hiberna quando fica parado (o
      # hostname dos logs tem "hibernate"), e o proxy que o acorda é mais um
      # salto. Com 2, o remoteAddress ainda era da Cloudflare (172.71.x,
      # 162.158.x) e o limite de login não segurava; com 3, a 11ª senha errada
      # deu 429 (18/10/2026). Se o serviço deixar de hibernar, volte para 2
      - key: TRUST_PROXY_HOPS
        value: '3'
      # Links e envio dos e-mails (reset de senha e contrato para aceite).
      # WEB_URL é o painel deste ambiente; sem ela o link cai no fallback
      - key: WEB_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
