name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  # Reutilizável: deploy-api.yml chama este workflow como job e só faz deploy se o CI passar
  workflow_call:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Type-check API
        run: npx tsc --noEmit -p apps/api

      - name: Type-check Web
        run: npx tsc --noEmit -p apps/web

      # Mobile tem 22 erros de tipos pré-existentes (baseline), todos causados por
      # @types/react duplicado no monorepo (bigint/ReactNode) em e2e/*.ts, ErrorBoundary,
      # OrderSwipeActions, ComponentsPreview e syncEngine.test.ts.
      # Semi-bloqueante: falha só se a contagem de erros exceder o baseline (regressão).
      # Ao reduzir os erros, baixe TSC_MOBILE_BASELINE; ao zerar, troque por `npx tsc --noEmit`
      # e inclua o mobile no `npm run type-check` da raiz (hoje só `type-check:mobile`, não-bloqueante).
      - name: Type-check Mobile
        working-directory: apps/mobile
        env:
          TSC_MOBILE_BASELINE: 22
        run: |
          count=$(npx tsc --noEmit 2>&1 | grep -c 'error TS' || true)
          echo "Erros de tipos no mobile: $count (baseline: $TSC_MOBILE_BASELINE)"
          if [ "$count" -gt "$TSC_MOBILE_BASELINE" ]; then
            echo "::error::Type-check mobile regrediu: $count erros > baseline $TSC_MOBILE_BASELINE"
            npx tsc --noEmit || true
            exit 1
          fi

      - name: Testes API
        working-directory: apps/api
        run: npm test

      - name: Testes Web
        working-directory: apps/web
        run: npm test

      - name: Testes Mobile (unit)
        working-directory: apps/mobile
        run: npx jest src/ --ci

      - name: Build API
        run: npm run build:api

      - name: Build Web
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3333
