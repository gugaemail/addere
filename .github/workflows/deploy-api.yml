name: Deploy API

on:
  push:
    branches: [main, staging]
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'packages/types/**'

jobs:
  # Roda o CI completo (lint, type-check, testes, build) antes de qualquer deploy
  ci:
    uses: ./.github/workflows/ci.yml

  migrate-and-deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build da API
        run: npm run build:api

      - name: Rodar migrations (production)
        if: github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT_PROD }}
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      # O build do Render também roda `migrate deploy` (render.yaml), então sem a
      # URL direta este passo avisa e segue — antes ele derrubava o workflow e o
      # deploy hook nunca disparava (desde 26/08/2026 o segredo estava cadastrado
      # como ATABASE_URL_DIRECT_STAGING, sem o D).
      - name: Rodar migrations (staging)
        if: github.ref == 'refs/heads/staging'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT_STAGING }}
        run: |
          if [ -z "$DATABASE_URL_DIRECT" ]; then
            echo "::warning::Segredo DATABASE_URL_DIRECT_STAGING vazio — a migration fica por conta do build do Render."
            exit 0
          fi
          npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - name: Disparar deploy no Render (production)
        if: github.ref == 'refs/heads/main'
        run: curl -fsSX POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"

      - name: Disparar deploy no Render (staging)
        if: github.ref == 'refs/heads/staging'
        run: curl -fsSX POST "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"
